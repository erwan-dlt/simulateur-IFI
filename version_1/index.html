<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur IFI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="panneau-gauche">
            <form id="formulaire-propriete">
                <h2>Simulateur de l'IFI</h2>
                <div class="groupe-formulaire">
                    <label for="residence-principale">Montant de la résidence principale:</label>
                    <input type="number" id="residence-principale" name="residence-principale">
                    <span class="unite">€</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="autres-biens">Montant des autres biens:</label>
                    <input type="number" id="autres-biens" name="autres-biens">
                    <span class="unite">€</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="augmentation-annuelle">Pourcentage d'augmentation des biens chaque année:</label>
                    <input type="number" id="augmentation-annuelle" name="augmentation-annuelle">
                    <span class="unite">%</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="taxe-fonciere">Estimation de la taxe foncière:</label>
                    <input type="number" id="taxe-fonciere" name="taxe-fonciere">
                    <span class="unite">€</span>
                </div>

                <h3>Prêt d'acquisition</h3>
                <div class="groupe-formulaire">
                    <label for="montant-pret">Montant du prêt:</label>
                    <input type="number" id="montant-pret" name="montant-pret">
                    <span class="unite">€</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="taeg-pret">TAEG du prêt:</label>
                    <input type="number" id="taeg-pret" name="taeg-pret">
                    <span class="unite">%</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="debut-pret">Année de départ:</label>
                    <input type="number" id="debut-pret" name="debut-pret" min="1900" max="2100">
                </div>

                <div class="groupe-formulaire">
                    <label for="fin-pret">Année de fin:</label>
                    <input type="number" id="fin-pret" name="fin-pret" min="1900" max="2100">
                </div>

                <div class="groupe-formulaire groupe-checkbox">
                    <label for="plafond-pret">Plafonner le montant:</label>
                    <input type="checkbox" id="plafond-pret" name="plafond-pret">
                </div>

                <h3>Prêt pour des travaux</h3>
                <div class="groupe-formulaire">
                    <label for="montant-pret-travaux">Montant du prêt:</label>
                    <input type="number" id="montant-pret-travaux" name="montant-pret-travaux">
                    <span class="unite">€</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="taeg-pret-travaux">TAEG du prêt:</label>
                    <input type="number" id="taeg-pret-travaux" name="taeg-pret-travaux">
                    <span class="unite">%</span>
                </div>

                <div class="groupe-formulaire">
                    <label for="debut-pret-travaux">Année de départ:</label>
                    <input type="number" id="debut-pret-travaux" name="debut-pret-travaux" min="1900" max="2100">
                </div>

                <div class="groupe-formulaire">
                    <label for="fin-pret-travaux">Année de fin:</label>
                    <input type="number" id="fin-pret-travaux" name="fin-pret-travaux" min="1900" max="2100">
                </div>

                <div class="groupe-formulaire groupe-checkbox">
                    <label for="plafond-pret-travaux">Plafonner le montant:</label>
                    <input type="checkbox" id="plafond-pret-travaux" name="plafond-pret-travaux">
                </div>
            </form>
        </div>
        <div class="panneau-droit">
            <div class="panneau-droit-haut">
                <h2>Calcul IFI par année</h2>
                <div class="cases-container" id="cases-container">
                    <!-- Les cases seront générées ici par JavaScript -->
                </div>
            </div>
            <div class="panneau-droit-bas">
                <h2>Récapitulatif des Calculs</h2>
                <div class="resultats-container" id="resultats-container">
                    <!-- Les résultats seront générées ici par JavaScript -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
